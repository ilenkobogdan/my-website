<!DOCTYPE html>
<html lang="uk" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ORBIT — система розвитку</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="loader" class="loader">
    <div class="l-orbit"><i></i></div>
    <b>ORBIT</b>
  </div>

  <header class="top">
    <a class="brand" href="#/home">ORBIT</a>

    <nav class="nav" aria-label="Розділи">
      <a data-route="home" href="#/home">Головна</a>
      <a data-route="dashboard" href="#/dashboard">Панель</a>
      <a data-route="goals" href="#/goals">Цілі</a>
      <a data-route="tasks" href="#/tasks">Завдання</a>
      <a data-route="habits" href="#/habits">Звички</a>
      <a data-route="achievements" href="#/achievements">Нагороди</a>
    </nav>

    <span id="chip" class="chip"></span>

    <button class="btn ghost small" data-action="theme" title="Змінити тему">
      Тема: <span id="theme-name"></span>
    </button>
  </header>

  <main id="view" class="view"></main>

  <footer class="foot">
    <span>ORBIT · навчальний проєкт. Дані зберігаються у твоєму браузері.</span>
    <button class="linkbtn" data-action="reset">Скинути дані</button>
  </footer>

  <div id="toasts" class="toasts" aria-live="polite"></div>

<script src="js/store.js"></script>
<script src="js/views.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/cloud.js"></script>
<script src="js/profile.js"></script>
<script src="js/app.js"></script>

</body>
</html>
